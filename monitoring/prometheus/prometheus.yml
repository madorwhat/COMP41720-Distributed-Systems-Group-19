global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4000

  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4001
  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4003