# Starts the Notification Service with everything it needs: `docker compose up --build`.
#   RabbitMQ UI:  http://localhost:15672  (guest / guest)
#
# All email goes out through Gmail, so before starting, put SMTP_USER (the Gmail address that
# sends the mail) and SMTP_PASS (a Gmail App Password) in a .env file next to this one.
# See .env.example and the README.
services:
  notification-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification_db
    ports:
      - '${NOTIFICATION_DB_HOST_PORT:-5435}:5432'
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notification -d notification_db']
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - '${RABBITMQ_HOST_PORT:-5672}:5672'
      - '${RABBITMQ_UI_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      retries: 20

  notification-service:
    build: .
    environment:
      DATABASE_URL: postgres://notification:notification@notification-postgres:5432/notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # The Gmail login. The service stops at startup with a clear message if these are empty.
      # Host and port are Gmail's; they only need changing for tests (to point somewhere harmless).
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Optional. Default: "Book My Visa <SMTP_USER>".
      MAIL_FROM: ${MAIL_FROM:-}
      # "New appointments are open" emails: at most one per person per country and visa type in
      # this many hours (0 = no limit), and the website address to put at the end of the email.
      SLOT_ALERT_COOLDOWN_HOURS: ${SLOT_ALERT_COOLDOWN_HOURS:-24}
      SITE_URL: ${SITE_URL:-}
      # The subscription routes check login tokens with Auth's public key (Auth creates it on
      # its first start), and allow the website's address.
      JWT_PUBLIC_KEY_PATH: /app/auth-keys/public.pem
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PORT: 4003
    ports:
      - '${NOTIFICATION_HOST_PORT:-4003}:4003'
    volumes:
      - ../auth-service/keys:/app/auth-keys:ro
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  notification_pgdata:
  rabbitmq_data:
