# Starts only the Booking Service and its database: `docker compose up --build`.
services:
  booking-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_db
    ports:
      - '${BOOKING_DB_HOST_PORT:-5434}:5432'
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booking -d booking_db']
      interval: 5s
      retries: 10

  booking-service:
    build: .
    environment:
      DATABASE_URL: postgres://booking:booking@booking-postgres:5432/booking_db
      JWT_PUBLIC_KEY_PATH: /app/auth-keys/public.pem
      PORT: 4001
      CORS_ORIGINS: http://localhost:3000
      # RabbitMQ is started by the Notification Service's compose file, which has its own network,
      # so from here it is reached through the host. Booking works without it (no emails then).
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@host.docker.internal:5672}
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Linux needs this line; Docker Desktop already knows the name
    ports:
      - '${BOOKING_HOST_PORT:-4001}:4001'
    volumes:
      - ../auth-service/keys:/app/auth-keys:ro
    depends_on:
      booking-postgres:
        condition: service_healthy

volumes:
  booking_pgdata:
