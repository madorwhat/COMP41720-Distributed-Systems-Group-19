openapi: 3.0.3
info:
  title: Visa Platform Auth Service
  version: 1.0.0
  description: |
    Signup, login, JWT issuance and RBAC. Access tokens go in `Authorization: Bearer <token>`.
    The refresh token lives in an httpOnly cookie (`refresh_token`, path `/auth`), so calls to
    `/auth/*` need `credentials: 'include'`.
servers:
  - url: http://localhost:4000

tags:
  - name: auth
  - name: admin
  - name: internal
  - name: public

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: Create an account (always role "user") and log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupBody' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the refresh cookie for a new access token (rotates the cookie)
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: New access token; a new refresh cookie is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh cookie (idempotent)
      security: [{ refreshCookie: [] }, {}]
      responses:
        '204': { description: Logged out }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Log out of every device
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: All sessions revoked }
        '401': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [auth]
      summary: Current user (read live from the DB)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/me/password:
    patch:
      tags: [auth]
      summary: Change password; other sessions are logged out, this one gets a fresh token pair
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/reset:
    post:
      tags: [auth]
      summary: Request a password reset link (same response whether or not the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password using the token from the reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }

  /admin/users:
    get:
      tags: [admin]
      summary: List users (admin, system_admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: q, in: query, description: Search email or name, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/users/{id}:
    get:
      tags: [admin]
      summary: One user (admin, system_admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/users/{id}/status:
    patch:
      tags: [admin]
      summary: Enable/disable an account (admins may target users; system admins may target users and admins)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/users/{id}/role:
    patch:
      tags: [admin]
      summary: Promote/demote between user and admin (system_admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [user, admin] }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/admins:
    post:
      tags: [admin]
      summary: Create an admin account (system_admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupBody' }
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/logs:
    get:
      tags: [admin]
      summary: Audit log, newest first (system_admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, example: booking } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        '403': { $ref: '#/components/responses/Error' }

  /internal/audit-logs:
    post:
      tags: [internal]
      summary: Record an admin action performed in another service
      security: [{ serviceKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                actorId: { type: string, format: uuid }
                actorEmail: { type: string, format: email }
                actorRole: { $ref: '#/components/schemas/Role' }
                action: { type: string, example: APPOINTMENT_STATUS_UPDATED }
                targetType: { type: string, example: appointment }
                targetId: { type: string, example: '123' }
                metadata: { type: object, additionalProperties: true }
                occurredAt: { type: string, format: date-time }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /.well-known/jwks.json:
    get:
      tags: [public]
      summary: Public signing key (JWK set)
      responses:
        '200': { description: '{ "keys": [ { kty, n, e, kid, alg: "RS256", use: "sig" } ] }' }

  /health:
    get:
      tags: [public]
      summary: Liveness + DB check
      responses:
        '200': { description: '{ "status": "ok", "db": "ok" }' }
        '503': { description: '{ "status": "degraded", "db": "down" }' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: refresh_token }
    serviceKey: { type: apiKey, in: header, name: X-Service-Key }

  parameters:
    UserId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  schemas:
    Role: { type: string, enum: [user, admin, system_admin] }
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: At least one letter and one digit
    SignupBody:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { $ref: '#/components/schemas/Password' }
        fullName: { type: string, maxLength: 100 }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        action: { type: string }
        sourceService: { type: string, enum: [auth, booking] }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        ip: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, INVALID_CREDENTIALS, UNAUTHENTICATED, TOKEN_EXPIRED, FORBIDDEN,
                     NOT_FOUND, EMAIL_TAKEN, ACCOUNT_DISABLED, RATE_LIMITED, INTERNAL]
            message: { type: string }
            details: { type: array, items: { type: object } }

  responses:
    Session:
      description: Logged in. The refresh token is set as an httpOnly cookie.
      headers:
        Set-Cookie: { schema: { type: string, example: 'refresh_token=...; Path=/auth; HttpOnly; SameSite=Strict' } }
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/User' }
              accessToken: { type: string }
    UserResponse:
      description: A user
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/User' }
    Message:
      description: A human-readable message
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    Error:
      description: Error in the standard shape
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
