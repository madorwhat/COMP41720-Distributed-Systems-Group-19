# Starts Postgres and the auth service together: `docker compose up --build`.
# On start, the service creates the tables, adds the team's admins and (first time only) its token keys.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432' # already running Postgres on 5432? change the left number
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth_db']
      interval: 5s
      retries: 10

  auth-service:
    build: .
    env_file: # your .env, if you have one
      - path: .env
        required: false
    environment:
      # inside Docker the database's address is "postgres", not localhost
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth_db
    ports:
      - '4000:4000'
    volumes:
      - ./keys:/app/keys # token keys live here; other services read public.pem from this folder
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
