# Postgres + auth service. Run `npm run keys:generate` and create .env (see README) first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432' # change the left side if you already run Postgres locally
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth_db']
      interval: 5s
      retries: 10

  auth-service:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth_db # container-to-container address
      DB_DIALECT: postgres
    ports:
      - '4000:4000'
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
